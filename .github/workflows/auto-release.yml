name: Auto release

# The Version Packages PR is the release review gate: once its checks pass,
# merge it, then hand the publish to `changesets.yml`.
#
# Two constraints shape this file. First, the merge uses GITHUB_TOKEN, which
# suppresses the push-triggered Changesets run, so the publish has to be
# dispatched explicitly. Second, npm's Trusted Publisher names a workflow file —
# `changesets.yml` (see scripts/trust-publishers.ts) — so publishing here would
# send an OIDC claim npm rejects; the publish must run in the named workflow.
#
# `workflow_run` on Tests used to trigger this, but it did not fire for the
# release PR's runs — GITHUB_TOKEN creates them and GitHub holds them in
# `action_required` until the Changesets job approves them. The Tests workflow
# therefore dispatches this one explicitly once `checks` and `e2e` pass.
#
# A manual dispatch is provided for recovery: `-f pr=<number>`.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Version Packages pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve and validate the Version Packages PR
        id: pr
        env:
          INPUT_PR: ${{ inputs.pr }}
        run: |
          PR="$INPUT_PR"
          if [ -z "$PR" ]; then
            echo "No Version Packages pull request to release."
            exit 1
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          STATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR is $STATE; nothing to merge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          BRANCH=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          DRAFT=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$BRANCH" != "changeset-release/main" ] || [ "$BASE" != "main" ] || [ "$DRAFT" = "true" ]; then
            echo "PR #$PR is not the Version Packages PR (branch=$BRANCH base=$BASE draft=$DRAFT)."
            exit 1
          fi

      - name: Wait for every pull request check
        if: steps.pr.outputs.skip != 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --interval 10

      - name: Merge the Version Packages PR
        if: steps.pr.outputs.skip != 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      # The dispatcher, not this workflow, is the identity npm trusts. It also
      # pushes the release tags and creates the GitHub releases.
      - name: Publish through the Changesets workflow
        if: steps.pr.outputs.skip != 'true'
        run: gh workflow run changesets.yml --ref main --repo "$GITHUB_REPOSITORY"

      # The version is already in package.json on main; the site can show it
      # without waiting for npm.
      - name: Refresh Pages with the released version
        if: steps.pr.outputs.skip != 'true'
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
