name: Changesets

# The release path: on every push to `main`, keep a "Version Packages" PR open.
# Merging it bumps versions and publishes. Local equivalent: `pnpm changeset`,
# then `pnpm version` / `pnpm release`.

on:
  push:
    branches: [main]
  # On demand too: the release path should be re-runnable after a token or
  # repository-permission change without waiting for the next push.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        uses: changesets/action@v1
        with:
          # `pnpm run`, not `pnpm`: `pnpm version` is pnpm's own command and
          # wants a semver argument, so it shadowed this repo's script and the
          # job failed with ERR_PNPM_INVALID_VERSION_BUMP. Same trap AGENTS.md
          # documents for `pnpm ci`. `release` has no pnpm built-in, but the
          # explicit form is what keeps the pair honest.
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
