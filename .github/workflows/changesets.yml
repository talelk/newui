name: Changesets

# The release path: on every push to `main`, keep a "Version Packages" PR open.
# Merging it bumps versions; when `NPM_PUBLISH` is enabled it also publishes via
# npm trusted publishing. Local equivalent: `pnpm changeset`, then `pnpm version`
# / `pnpm release`.

on:
  push:
    branches: [main]
  # On demand too: the release path should be re-runnable after a token or
  # repository-permission change without waiting for the next push.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the CLI exchanges this OIDC token for a
  # short-lived publish credential. No long-lived NPM_TOKEN is stored.
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        uses: changesets/action@v2.1.2
        with:
          # `pnpm run`, not `pnpm`: `pnpm version` is pnpm's own command and
          # wants a semver argument, so it shadowed this repo's script and the
          # job failed with ERR_PNPM_INVALID_VERSION_BUMP. Same trap AGENTS.md
          # documents for `pnpm ci`. `release` has no pnpm built-in, but the
          # explicit form is what keeps the pair honest.
          #
          # `*-script` is the v2 name: `version` and `publish` were renamed, and
          # passing the old pair is now a hard error — the action refuses before
          # it looks at anything else, which is how a dependency bump silently
          # turned the release path red.
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Flip this repository variable to true after the first publish and
          # the per-package Trusted Publisher setup.
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
