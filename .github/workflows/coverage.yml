name: Coverage

# Coverage on pull requests. It runs the instrumented suite and uploads the
# report as an artifact, so a reviewer can diff the delta against `main`
# (and a follow-up can wire a comment service without adding a third-party
# action). Local equivalent: `pnpm test:coverage`.

on:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn
