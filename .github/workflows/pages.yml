name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Resolve bases
        id: bases
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          base="${base%/}"
          echo "site=$base" >> "$GITHUB_OUTPUT"
          echo "storybook=$base/storybook" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: pnpm build:playground
        env:
          VITE_BASE: ${{ steps.bases.outputs.site }}
          VITE_STORYBOOK_BASE: ${{ steps.bases.outputs.storybook }}

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Add Pages fallback and Storybook
        run: |
          cp -R apps/playground/storybook-static apps/playground/dist/storybook
          cp apps/playground/dist/index.html apps/playground/dist/404.html
          touch apps/playground/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
