name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded PR run is wasted minutes; the push run on main is the one
# that matters.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # The step names and commands below are mirrored by `scripts/ci-steps.ts`;
      # `ci.test.ts` fails if the two drift. Run the same pipeline locally with
      # `pnpm verify` (`pnpm ci` is pnpm's own clean-install command).
      - name: Lint & format (Biome)
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Lint Solid (ESLint)
        if: ${{ !cancelled() }}
        run: pnpm lint:solid

      - name: Architecture (dependency-cruiser)
        if: ${{ !cancelled() }}
        run: pnpm arch

      - name: Package manifest (publint)
        if: ${{ !cancelled() }}
        run: pnpm packages:check

      - name: Package tarball smoke
        if: ${{ !cancelled() }}
        run: pnpm packages:smoke

      - name: Dead code & unused deps (Knip)
        if: ${{ !cancelled() }}
        run: pnpm knip

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: API table is current
        if: ${{ !cancelled() }}
        run: pnpm api:check

      - name: Spec props & code samples
        if: ${{ !cancelled() }}
        run: pnpm specs:check

      - name: Reference paths exist
        if: ${{ !cancelled() }}
        run: pnpm refs:check

      - name: Agent Skills validate & stale
        if: ${{ !cancelled() }}
        run: pnpm skills:check

      - name: Site data is current
        if: ${{ !cancelled() }}
        run: pnpm site:check

      - name: Story index is current
        if: ${{ !cancelled() }}
        run: pnpm stories:check

      - name: Docs site builds
        if: ${{ !cancelled() }}
        run: pnpm docs:build

      - name: Tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: tw-merge sweep (all-pairs equivalence)
        if: ${{ !cancelled() }}
        run: pnpm test:sweep

      - name: SSR smoke tests
        if: ${{ !cancelled() }}
        run: pnpm test:ssr

      - name: Bundle budget & tree-shaking
        if: ${{ !cancelled() }}
        run: pnpm size

      - name: Build packages
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Build playground
        if: ${{ !cancelled() }}
        run: pnpm build:playground

      - name: Build starter
        if: ${{ !cancelled() }}
        run: pnpm build:starter

      - name: CSS emission (every referenced utility is emitted)
        if: ${{ !cancelled() }}
        run: pnpm css:check

      - name: Route JS budget (every route and the starter, gzip)
        if: ${{ !cancelled() }}
        run: pnpm budget

      - name: Lighthouse budgets
        if: ${{ !cancelled() }}
        run: pnpm lighthouse

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # The harness pins Playwright's bundled Chromium rather than whatever
      # Chrome the runner happens to ship: a Chrome version apart is 17 pixels on
      # a screenshot and zero on every assertion, which is how a visual suite
      # starts disagreeing with itself.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Browser the harness pins
        run: pnpm exec playwright install chromium

      - name: Component browser tests (real CSS)
        run: pnpm test:browser

      - name: Browser harness (a11y · interaction · responsive · perf)
        run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
