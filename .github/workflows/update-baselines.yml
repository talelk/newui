name: Update e2e baselines

# Visual snapshots and the state-shift ratchet are rasterisation-dependent: a
# baseline captured on a developer machine can disagree with the CI runner (a
# font change left four of them stale on main for two days). Regenerate them
# where they are judged, then review the images in the PR.
#
# Run it from the Actions tab after a deliberate visual change:
#   gh workflow run update-baselines.yml --ref <branch>
#
# The PR is opened with GITHUB_TOKEN, so GitHub does not start its checks. Push
# an empty commit to the branch (or close and reopen the PR) to run them.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-baselines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache the Playwright browser
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Browser the harness pins
        run: pnpm playwright:install

      # --workers=1 keeps the state-shift baseline rewrite deterministic (every
      # family test merges into the one file). The run itself may report
      # failures; what matters is the files it leaves behind.
      - name: Regenerate snapshots and the state-shift baseline
        env:
          UPDATE_STATE_SHIFT: '1'
        run: pnpm exec playwright test --project=chrome --update-snapshots --workers=1 --retries=0 e2e/visual.spec.ts e2e/state-transition.spec.ts
        continue-on-error: true

      - name: Open a pull request with the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain e2e)" ]; then
            echo "Baselines are already current; nothing to propose."
            exit 0
          fi
          BRANCH="ci/update-baselines-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add e2e
          git commit -m "test(e2e): regenerate baselines on the CI runner"
          git push origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "test(e2e): regenerate baselines on the CI runner" \
            --body "Regenerated by the Update e2e baselines workflow (run ${GITHUB_RUN_ID}). Review the changed images and the state-shift diff before merging: the state-shift ratchet should only shrink, so any growth needs a reason."
