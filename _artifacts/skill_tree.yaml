distribution:
  mode: none
coverage:
  ignored_packages:
    - name: '@talelk/newui-charts'
      reason: optional organism-level chart package; its API is covered by source and
        stories, not the core UI skill
    - name: '@talelk/newui-code-editor'
      reason: optional organism-level editor add-on; its API is covered by source and
        stories
    - name: '@talelk/newui-editor'
      reason: optional organism-level rich-text add-on; its API is covered by source
        and stories
    - name: '@talelk/newui-icons'
      reason: glyph names are implementation detail of the UI skill's icon convention
    - name: '@talelk/newui-molecules'
      reason: covered by the newui UI skill, which routes molecules to their installed
        source
    - name: '@talelk/newui-organisms'
      reason: covered by the newui UI skill, which routes organisms to their installed
        source
    - name: '@talelk/newui-tailwind'
      reason: covered by the newui UI skill's semantic-token rules
    - name: '@talelk/newui-templates'
      reason: covered by the newui UI skill, which routes templates to their installed
        source
    - name: '@talelk/newui-tokens'
      reason: covered by the newui UI skill's semantic-token rules
    - name: '@talelk/newui-vite'
      reason: development build integration, not runtime guidance
