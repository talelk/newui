packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  '@biomejs/biome': true

minimumReleaseAgeExclude:
  - '@vitest/browser-playwright@5.0.5'
  - '@vitest/browser@5.0.5'
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/spy@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
  - vitest@5.0.5
  - '@asamuzakjp/dom-selector@10.0.3'
  - '@axe-core/playwright@4.14.0'
  - jsdom@30.1.3
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/solid-query@5.104.3'
  - '@tanstack/solid-virtual@3.13.47'
  - '@tanstack/virtual-core@3.19.5'

# Security floors for transitive dependencies (pnpm audit, 2026-11-07). Each
# override only lifts the vulnerable range to its patched release; remove an
# entry once every dependent requires the patched version itself.
overrides:
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'seroval@<1.6.11': ~1.6.11
  'seroval-plugins@<1.6.11': ~1.6.11
  'postcss-selector-parser@<6.1.5': ^6.1.5
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
